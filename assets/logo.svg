<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="pokebot-3ds logo">
  <title>pokebot-3ds</title>
  <!-- A Poke Ball whose centre button is a bot visor. Few, thick shapes
       so it reads at 16 px. scripts/gen_logo.py renders the PNG/ICO. -->
  <defs>
    <clipPath id="top"><rect x="0" y="0" width="256" height="128"/></clipPath>
    <clipPath id="bottom"><rect x="0" y="128" width="256" height="128"/></clipPath>
  </defs>
  <circle cx="128" cy="128" r="118" fill="#0F1012"/>
  <circle cx="128" cy="128" r="104" fill="#E5484D" clip-path="url(#top)"/>
  <circle cx="128" cy="128" r="104" fill="#ECEDEF" clip-path="url(#bottom)"/>
  <ellipse cx="84" cy="60" rx="28" ry="16" fill="#FFFFFF" fill-opacity="0.25"/>
  <rect x="16" y="116" width="224" height="24" fill="#0F1012"/>
  <rect x="76" y="96" width="104" height="64" rx="26" fill="#0F1012"/>
  <rect x="88" y="108" width="80" height="40" rx="16" fill="#1B1D21"/>
  <circle cx="110" cy="128" r="9" fill="#E5484D"/>
  <circle cx="146" cy="128" r="9" fill="#E5484D"/>
</svg>
