# pokebot-3ds configuration

# Bot mode. One of: observe, encounter, soft_reset
mode: observe

# Optional: explicit game registry key (otherwise auto-detected by title ID).
# Available keys: X-USA, Y-USA, OR-USA, AS-USA, SM-USA-1.2, USUM-USA-1.2
# game: USUM-USA-1.2

# Connection to Azahar
rpc:
  host: 127.0.0.1
  port: 45987
  connect_timeout: 30

# Input driver (pynput-based keyboard simulation).
# Azahar must remain focused for keystrokes to register.
input:
  dry_run: false
  # How the RUN touch (and the focus click) is delivered:
  #   restore - real click, then your pointer is put straight back.
  #             Default. The pointer jumps for ~50 ms per flee.
  #   post    - no mouse events at all. Azahar may ignore posted
  #             clicks entirely, so only use this if fleeing still
  #             works for you.
  #   cursor  - legacy: leaves the pointer on the RUN button.
  mouse_mode: restore
  binds:
    A:        a
    B:        s
    X:        z
    Y:        x
    L:        q
    R:        w
    Start:    m
    Select:   n
    DpadUp:   t
    DpadDown: g
    DpadLeft: f
    DpadRight: h

# Mode-specific options
soft_reset:
  read_slot: 0           # which party slot the gift Pokemon lands in
  # (snorlax / lapras targets only — the starter hunt no longer waits
  # after a reset, it presses A straight through the boot logos)
  post_reset_wait: 12.0
  post_reset_taps: 6
  post_reset_gap: 1.0

  # --- Starter hunt: hold Left, press A until it lands in the party --
  #
  # Left is HELD for the whole sequence rather than tapped. A tap only
  # moves the cursor if it lands while the selection is actually up, so
  # the old stepwise sequence had to aim each press at a moment in a
  # cutscene whose timing the bot cannot see; a misfire meant receiving
  # the wrong starter and burning the attempt. A held direction is
  # already down whenever the game gets round to reading it.
  #
  # So you get the starter at the held end of the row. Set this to
  # CircleLeft if the title acts on the Circle Pad, DpadRight for the
  # other end, or leave it empty ("") for no hold at all.
  hold_button: DpadLeft
  #
  # Save in front of the starter table with an EMPTY party.
  #
  # press_hold sets the rate, the same way it does for the Celebi hunt.
  # The floor is Azahar's: a key posted to its window is picked up when
  # Qt next drains its event queue, so a press held for less than one
  # of those can go down and up inside a single polled frame and score
  # no press at all.
  #   0.030 -> ~33 presses/s  (default)
  #   0.020 -> ~49 presses/s
  #   0.010 -> ~96 presses/s  (back off if attempts start timing out)
  press_hold: 0.03
  press_interval: 0.0    # extra gap after each press; 0 = flat out
  detect_every: 0.15     # how often to check the party while pressing.
                         # The fast party check is a dozen RPC round
                         # trips against 30ms for a press, so checking
                         # every press would halve the rate for nothing.
                         # This bounds the overshoot past the moment the
                         # starter lands to about five presses, which is
                         # what keeps the spam out of the nickname prompt.
  receive_timeout: 180   # give up on an attempt after this long, and say
                         # so — this is also how a dead input path shows
  # Shortest gap between soft resets. X/Y's L+R+Start is not a screen
  # transition — the game asks the 3DS to relaunch it, so Azahar tears
  # the whole title down and rebuilds it: ExHeader parse, Vulkan
  # renderer re-init, pipeline and shader disk caches reloaded, a 512 MB
  # upload buffer allocated afresh. 16 of those in 250 seconds was
  # measured, and Azahar died partway through one of them.
  #
  # 0 leaves the rate uncapped. Raise it if Azahar keeps crashing: it
  # costs hunt speed and buys the emulator time to finish rebuilding
  # itself before being asked to do it again. Try 20-30 first.
  # Seconds of NO memory reads BEFORE the reset combo is sent.
  #
  # The mirror of reload_read_grace below. Evaluating an attempt ends in
  # a party scan, so reads were going out right up to the instant
  # L+R+Start landed — and Azahar services RPC on its own thread, so a
  # read sent a moment earlier can still be in flight when the teardown
  # begins. A grace afterwards cannot help with one already sent.
  #
  # Half a second is far longer than a loopback UDP queue needs.
  pre_reset_quiet: 0.5

  # Seconds after a soft reset during which the bot reads NO memory.
  #
  # L+R+Start makes the game ask the 3DS to relaunch it, so Azahar spends
  # the next moment destroying the running process and building a new
  # one. Its RPC server holds a pointer to that process, and a read
  # landing mid-teardown dereferences memory being freed — Windows
  # recorded four of those as 0xc0000005 access violations inside
  # azahar.exe, all in ONE fault bucket, on both Vulkan and OpenGL.
  #
  # A presses carry on throughout; only the reading waits. Raise this if
  # Azahar still crashes around resets.
  reload_read_grace: 4.0
  reset_cooldown: 0
  reset_timeout: 30      # how long to wait for the party to empty after
                         # L+R+Start. If it never does, the reset did not
                         # register and the hunt stops rather than
                         # pressing A into whatever is still on screen.

  # Trainer name (in-game OT name, exactly as you set it). Used as
  # a fast RAM anchor: the bot searches for this string as UTF-16LE
  # to locate party_base in seconds, even when slot 0 is empty.
  # Once a successful brute-force scan finds party_base AND this
  # string is set, the bot caches `trainer_to_party_offset` below
  # automatically. Subsequent runs skip the PK6 scan entirely.
  trainer_name: Roman
  # trainer_to_party_offset: 0x...  # written automatically
  # Optional: lock the bot to a specific starter for the current game.
  # Wrong-species results soft-reset without evaluating the target.
  # Names per game:
  #   X / Y                          chespin, fennekin, froakie
  #   Omega Ruby / Alpha Sapphire    treecko, torchic, mudkip
  #   Sun / Moon / USUM              rowlet, litten, popplio
  # starter: chespin

# Memory offsets for your specific game/version.
# Run `python -m pokebot.find_offsets` to discover these automatically,
# then paste the results below. Use hex (0x...) or decimal.
#
# Example for Pokémon Ultra Sun/Moon (US, v1.2):
#   party_base:     0x330D8B58
#   foe_base:       0x330D93D8
#   in_battle_flag: 0x330D9438
#   party_stride:   484
#
# Without these the dashboard will show no party or encounter data.
# Authoritative X/Y live-RAM addresses from PKMN-NTR LookupTable.cs
# (drgoku282/PKMN-NTR). These are real-hardware NTR virtual addresses;
# Azahar reads them directly (trainer region is shifted -0x10, the
# 0x088xxxxx wild region is at its native address).
offsets:
  # PartyOffset (X/Y): 6 live party slots, encrypted ekx, 484 B apart.
  party_base: 0x08CE1CF8
  party_stride: 484
  # WildOffset1 (X/Y): the encounter Pokémon lives somewhere in the
  # ~128 KB at 0x08800000 — it is NOT at a fixed sub-offset; scan the
  # region for a checksum-valid encrypted PK6 (PKMN-NTR ReadOpponent).
  foe_base: 0x08800000
  foe_stride: 484
  # Scan the WHOLE WildOffset1 region. Azahar relocates the wild slot
  # per session (one run it was ~0x3ecc in, another it's elsewhere),
  # so a small window misses it entirely. 0x20000 = PKMN-NTR's
  # ReadOpponent size; the cheap Sanity pre-filter keeps it fast.
  foe_scan_len: 0x20000
  in_battle_flag: 0x0        # TODO: not yet located (battle-state u8)

# Celebi soft-reset hunt (Pokemon Crystal, Virtual Console).
#
# Save standing in front of the Ilex Forest shrine with the GS Ball
# placed, so that ONE A press starts the encounter. The bot spams A
# until Celebi appears, checks its DVs, and soft-resets if it is not
# shiny. On a shiny it STOPS COMPLETELY and sends no further input —
# the fight is yours.
#
# The reset is the Game Boy combo A+B+Start+Select, handled by the Gen 2
# ROM itself, so it leaves Azahar and the located WRAM base untouched.
celebi_hunt:
  # A presses, as fast as Azahar will take them. The whole cost of a
  # press is these two numbers — the keypress itself and the one-byte
  # battle check are microseconds beside them.
  #
  # The floor is set by Azahar, not by us: a key posted to its window is
  # picked up when Qt next drains its event queue, so a press held for
  # less than one of those can go down and come up inside a single
  # emulated joypad read, which the game scores as no press at all.
  #   0.030 -> ~33 presses/s  (default, comfortable margin)
  #   0.020 -> ~49 presses/s
  #   0.010 -> ~96 presses/s  (try it; back off if attempts time out)
  press_hold: 0.03
  press_interval: 0.0        # extra gap after each press; 0 = flat out
  encounter_timeout: 120     # give up A-spamming after this long, and say so
  reset_hold: 0.6            # how long to hold A+B+Start+Select
  boot_timeout: 90           # wait this long for the save to reload
  # Same meaning as random_encounters.enemy_dv_check below. Every
  # attempt ALSO cross-checks the DV reading against the opponent's max
  # HP (Celebi at Lv30 with HP DV 4 must have 102), and the hunt halts
  # rather than resetting past shinies on a reading it cannot trust.
  enemy_dv_check: paranoid

# Random-encounter shiny hunt tuning.
random_encounters:
  # --- Pokémon Crystal (Virtual Console) ---------------------------
  # How the opponent's shininess is judged. The in-battle structure's
  # DV offset is not confirmed yet, and reading the wrong byte would
  # silently MISS a shiny.
  #   paranoid - test every candidate offset in the opponent region.
  #              Cannot miss a shiny; stops on a coincidence roughly
  #              once every 200 encounters.
  #   strict   - trust the single configured offset. Use this after
  #              scripts/find_enemy_dvs.py confirms it (1 in 8192).
  # Which pad walks. Azahar binds the D-pad and the Circle Pad to
  # different keys (F/H/T/G vs the arrow keys) and a Virtual Console
  # title may act on only one. Run scripts/test_input.py to find out
  # which one Azahar actually responds to.
  movement_pad: dpad         # dpad | circle
  enemy_dv_check: paranoid
  flee_settle: 1.2           # pause before the RUN sequence (Gen 2)
  movement: horizontal       # horizontal (Left/Right) | vertical (Up/Down)
  # Seconds per direction press, and the pause between presses.
  # Short = the player flips direction faster = more grass steps per
  # second = more encounters. These presses also continue THROUGH the
  # battle (see below), so shortening them speeds the whole hunt.
  walk_hold: 0.10
  walk_gap: 0.05
  # --- Getting out of a battle --------------------------------------
  #
  # These were tuned against a 100% emulator and cost 12.7 s an
  # encounter. Azahar runs this hunt around 600%, where the same
  # animations take roughly a sixth of the time, so most of that was
  # the bot waiting for something already finished. Total is now
  # ~3.4 s.
  #
  # Cutting them risks the RUN touch landing before the menu is drawn,
  # which strands the bot in a battle it cannot see — stuck_timeout
  # below is what makes that recoverable. Raise these (and lower
  # stuck_timeout) if you see stalls in the log.
  flee_delay: 1.5        # battle intro, before anything is pressed
  flee_intro_taps: 4     # B, to clear "a wild X appeared!"
  flee_intro_gap: 0.15
  run_settle: 0.3        # command menu draw, before touching RUN
  flee_got_away: 0.8     # "Got away!" text
  flee_clear_taps: 3     # B, to clear it
  flee_clear_gap: 0.25
  flee_tail: 0.8         # battle fade + overworld slide-back
  #
  # Stall watchdog. Running through grass produces an encounter every
  # few seconds, so a long silence is not bad luck — it almost always
  # means the RUN touch missed and the bot is stepping into a battle
  # menu it cannot see, forever. After this many seconds with no new
  # encounter the flee sequence is thrown again. 0 disables it.
  stuck_timeout: 60
  # Azahar screen layout — how the two 3DS screens are arranged in
  # the window. The RUN-button position is computed from this + the
  # live window size, so it stays correct at ANY window size.
  #   side_by_side : top screen left, touch screen RIGHT  (your setup)
  #   vertical     : top screen above, touch screen below (Azahar default)
  screen_layout: side_by_side
  # Where RUN sits ON the 3DS touch screen, as fractions of that
  # screen (0,0=top-left .. 1,1=bottom-right). X/Y wild battle: RUN
  # is the blue button, bottom-centre → ~(0.50, 0.86). Nudge only if
  # the flee still misses (e.g. y 0.84–0.90).
  run_local: [0.50, 0.86]
  # Optional hard override of the WINDOW-fraction touch point. Leave
  # null to auto-position from screen_layout + window size (robust to
  # resizing). Set e.g. [0.78, 0.72] only to pin it manually.
  run_touch: null

  # Movement does NOT stop for a battle. The flee sequence spends its
  # waits walking, so the player is already moving the instant the
  # battle releases — that dead time used to be pure loss. Movement
  # stops the moment a shiny is found, so nothing is nudging the menu
  # cursor while the catch sequence runs.

  # --- What happens when the hunt finds its target ------------------
  #   catch - throw balls at it, then carry on hunting (default)
  #   stop  - halt with the battle open and let you catch it by hand
  on_target: catch
  # The catch is BAG → POKÉ BALLS → first slot in the pocket, i.e.
  # whatever ball sits top-left. Put the ball you want thrown there;
  # a Master Ball catches on the first attempt every time.
  #
  # Positions are fractions of the 3DS TOUCH screen, same convention
  # as run_local, so they stay correct at any window size. Measured
  # from X/Y's wild-battle UI — only nudge these if a touch misses.
  bag_local:   [0.135, 0.86]   # BAG, bottom-left of the command menu
  balls_local: [0.743, 0.205]  # POKÉ BALLS, top-right bag pocket
  ball_local:  [0.245, 0.117]  # first item row in the pocket
  # Hard WINDOW-fraction overrides, as run_touch is for RUN. Normally
  # unset: bag_touch / balls_touch / ball_touch.
  #
  # A ball that isn't a Master Ball can break out, which hands the
  # turn back — so the sequence repeats until the catch shows up in
  # your party, or these attempts run out. The bot STOPS rather than
  # walking away from an unconfirmed shiny.
  catch_attempts: 5
  catch_menu_settle: 1.5     # command menu draw, before touching BAG
  catch_bag_settle: 1.2      # pocket list draw
  catch_pocket_settle: 1.2   # item list draw
  # Touching the ball only SELECTS it — the game still wants a confirm
  # before it leaves your hand. Without this press the sequence sits on
  # the item screen and no ball is ever thrown.
  catch_select_settle: 0.5   # let the selection register
  catch_throw_button: A
  catch_throw_taps: 1
  catch_throw_tap_gap: 0.3
  catch_throw_settle: 6.0    # throw + shakes + "Gotcha!"
  catch_confirm_window: 12.0 # per attempt, watching the party for it
  # After the ball is thrown the game runs a long chain of text boxes:
  # shakes, "Gotcha!", the Pokédex entry, the nickname prompt, "sent
  # to Box". Hammering B is much faster than waiting each one out, and
  # B answers "no" to the nickname prompt on the way past.
  catch_post_throw_taps: 25
  catch_post_throw_gap: 0.12

# Target / filter is configured in the launcher (Hunt → Target filter).
# Default is "Shiny only". To override from the CLI: pass --target shiny
# (or any|perfect5|perfect6|shiny+perfect4) to run.py.

# Durable event log. One JSON object per line, written as the bot runs
# (CLI runs included), rotated at 5 MB keeping 3 old files.
#
# This is what makes "was a shiny missed 4,000 encounters ago?"
# answerable — the launcher's table only holds the last 30 encounters
# in memory. Audit it with:
#
#     python scripts/audit_log.py
#
logging:
  event_log: true
  # event_log_path: logs/events.jsonl   # default; pinned windows get
  #                                     # logs/events-pid<PID>.jsonl

# In-app updates.
#
# The launcher checks GitHub once at startup and, if a newer build is
# published, shows a bar with an "Update now" button. Nothing is ever
# downloaded or installed without you pressing it.
#
# An update replaces program files only. This config.yaml, your
# targets/ exports, your logs and your stats are never touched, and
# every replaced file is copied to .update-backup/<timestamp>/ first.
#
# From the command line:
#     python run.py --check-update
#     python run.py --update
updates:
  check_on_start: true
