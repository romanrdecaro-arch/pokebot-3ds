name: Tests

# Runs the unit suite on every push and PR. The bot itself needs a
# running emulator, so these cover only the pure logic that can be
# exercised headlessly: config parsing and the config write-back that
# edits the user's real config.yaml in place.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest PyYAML

      - name: Check every module imports
        run: |
          python - <<'PY'
          import importlib, pkgutil, sys
          mods = (['pokebot.' + m.name for m in pkgutil.iter_modules(['pokebot'])]
                  + ['pokebot.modes.' + m.name
                     for m in pkgutil.iter_modules(['pokebot/modes'])])
          failed = []
          for name in mods:
              try:
                  importlib.import_module(name)
              except Exception as exc:
                  failed.append(f"{name}: {type(exc).__name__}: {exc}")
          for line in failed:
              print("FAIL", line)
          print(f"{len(mods) - len(failed)}/{len(mods)} modules import cleanly")
          sys.exit(1 if failed else 0)
          PY

      - name: Run tests
        run: pytest tests/ -v
